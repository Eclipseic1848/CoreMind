<!DOCTYPE html>
<!--
  CoreMind Web 面板 UI 原型（PROTOTYPE — 用完即弃，勿进生产）
  问题：可视化面板该长什么样？
  三个结构不同的变体，?variant=A|B|C 切换，底部浮动条 / 键盘 ←→ 切换：
    A — 流程视图（步骤图 + 输出 + 工具日志，三栏）
    B — 控制台时间线（深色单栏，按时间顺序高密度）
    C — 泳道视图（按 agent 分栏 + 顶部概览卡）
  数据：模拟 weekly-report 模板一次运行的事件序列（CoreMindEvent 契约），
  点「▶ 运行」回放。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoreMind 面板原型（PROTOTYPE）</title>
<style>
  :root { --ok:#16a34a; --err:#dc2626; --run:#2563eb; --muted:#64748b; --border:#e2e8f0; --bg:#f8fafc; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:#0f172a; }
  #app { min-height:100vh; padding:12px; }
  /* 通用顶栏 */
  .topbar { display:flex; align-items:center; gap:14px; padding:10px 14px; background:#fff; border:1px solid var(--border); border-radius:10px; margin-bottom:12px; }
  .topbar .title { font-weight:600; font-size:15px; }
  .topbar .badge { font-size:12px; padding:2px 8px; border-radius:99px; }
  .badge.running { background:#dbeafe; color:var(--run); }
  .badge.done { background:#dcfce7; color:var(--ok); }
  .badge.wait { background:#f1f5f9; color:var(--muted); }
  .stat { margin-left:auto; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .stat b { color:#0f172a; }
  /* 播放控制 */
  .controls { display:flex; gap:8px; align-items:center; padding:8px 14px; background:#fff; border:1px solid var(--border); border-radius:10px; margin-bottom:12px; }
  .controls button { border:1px solid var(--border); background:#fff; border-radius:6px; padding:5px 14px; font-size:13px; cursor:pointer; }
  .controls button:hover { background:#f1f5f9; }
  .controls .progress { flex:1; height:6px; background:#e2e8f0; border-radius:99px; overflow:hidden; }
  .controls .progress > div { height:100%; background:var(--run); width:0%; transition:width .2s; }
  /* ============ 变体 A：流程视图（三栏） ============ */
  .va { display:grid; grid-template-columns:240px 1fr 300px; gap:12px; align-items:start; }
  .va .panel { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .va .panel h3 { font-size:12px; color:var(--muted); padding:10px 14px 6px; font-weight:600; letter-spacing:.05em; }
  /* 步骤图 */
  .va .steps { padding:6px 14px 14px; }
  .va .step { display:flex; gap:10px; padding:8px 0; border-left:2px solid var(--border); margin-left:6px; padding-left:12px; position:relative; }
  .va .step:last-child { border-left:2px solid transparent; }
  .va .step .dot { width:10px; height:10px; border-radius:99px; margin-top:4px; flex:none; }
  .va .step .dot.pending { background:#cbd5e1; }
  .va .step .dot.running { background:var(--run); animation:pulse 1s infinite; }
  .va .step .dot.ok { background:var(--ok); }
  .va .step .dot.fail { background:var(--err); }
  @keyframes pulse { 50% { opacity:.4; } }
  .va .step .name { font-size:13px; font-weight:500; }
  .va .step .kind { font-size:11px; color:var(--muted); }
  .va .step .sub { font-size:11px; color:var(--muted); padding-left:20px; }
  /* 输出区 */
  .va .out { padding:8px 14px 14px; max-height:70vh; overflow:auto; }
  .va .agent-block { border:1px solid var(--border); border-radius:8px; margin:8px 0; }
  .va .agent-head { font-size:12px; font-weight:600; padding:6px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .va .agent-head .avatar { width:18px; height:18px; border-radius:99px; color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; }
  .va .agent-body { padding:10px; font-size:13px; line-height:1.7; white-space:pre-wrap; }
  .va .tool-row { font-size:12px; color:var(--muted); padding:3px 10px; font-family:ui-monospace,Consolas,monospace; }
  .va .tool-row .t-ok { color:var(--ok); } .va .tool-row .t-err { color:var(--err); }
  /* 工具日志 */
  .va .tools { padding:6px 14px 14px; max-height:70vh; overflow:auto; }
  .va .titem { font-size:12px; padding:5px 0; border-bottom:1px dashed var(--border); font-family:ui-monospace,Consolas,monospace; }
  .va .titem .tt { font-weight:600; }
  .va .titem .ok { color:var(--ok); } .va .titem .err { color:var(--err); }
  .va .titem .args { color:var(--muted); font-size:11px; word-break:break-all; }
  /* ============ 变体 B：控制台时间线（深色单栏） ============ */
  .vb { background:#0b1220; color:#e2e8f0; border-radius:10px; padding:14px 18px 24px; font-family:ui-monospace,Consolas,"Cascadia Mono",monospace; font-size:12.5px; line-height:1.7; }
  .vb .topbar { background:transparent; border:1px solid #1e293b; }
  .vb .topbar .title { color:#e2e8f0; }
  .vb .topbar .badge.running { background:#1e3a5f; color:#7dd3fc; }
  .vb .topbar .badge.done { background:#14532d; color:#4ade80; }
  .vb .stat b { color:#e2e8f0; }
  .vb .line { display:flex; gap:10px; padding:2px 0; }
  .vb .line .t { color:#475569; flex:none; width:56px; }
  .vb .stepbar { border-top:1px solid #1e293b; border-bottom:1px solid #1e293b; margin:8px 0; padding:6px 0; color:#7dd3fc; }
  .vb .agent-line { color:#94a3b8; }
  .vb .agent-line .who { color:#60a5fa; font-weight:600; }
  .vb .text-block { background:#0f172a; border-left:2px solid #334155; padding:6px 10px; margin:4px 0 4px 20px; white-space:pre-wrap; }
  .vb .tool-line { color:#fbbf24; }
  .vb .tool-line .res-ok { color:#4ade80; } .vb .tool-line .res-err { color:#f87171; }
  /* ============ 变体 C：泳道视图（按 agent 分栏） ============ */
  .vc .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:12px; }
  .vc .card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .vc .card .k { font-size:11px; color:var(--muted); }
  .vc .card .v { font-size:18px; font-weight:700; margin-top:2px; }
  .vc .lanes { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; align-items:start; }
  .vc .lane { background:#fff; border:1px solid var(--border); border-radius:10px; min-height:420px; display:flex; flex-direction:column; }
  .vc .lane h3 { font-size:12px; padding:10px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .vc .lane h3 .avatar { width:18px; height:18px; border-radius:99px; color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; }
  .vc .lane .body { padding:10px; flex:1; }
  .vc .msg { background:#f8fafc; border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:12.5px; line-height:1.6; white-space:pre-wrap; }
  .vc .msg .toolrow { font-size:11px; color:var(--muted); font-family:ui-monospace,monospace; margin-top:4px; }
  .vc .msg .toolrow .ok { color:var(--ok); } .vc .msg .toolrow .err { color:var(--err); }
  .vc .stepline { background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px 14px; display:flex; gap:10px; font-size:12px; color:var(--muted); }
  .vc .stepline .s { display:flex; align-items:center; gap:5px; }
  .vc .stepline .s .dot { width:8px; height:8px; border-radius:99px; }
  .vc .stepline .s.done .dot { background:var(--ok); } .vc .stepline .s.run .dot { background:var(--run); animation:pulse 1s infinite; }
  /* ============ 底部切换条 ============ */
  #switcher { position:fixed; left:50%; transform:translateX(-50%); bottom:18px; background:#0f172a; color:#fff; border-radius:99px; padding:8px 12px; display:flex; align-items:center; gap:14px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:99; font-size:13px; user-select:none; }
  #switcher button { background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer; padding:0 4px; }
  #switcher button:hover { color:#fff; }
  #switcher .label b { color:#7dd3fc; }
  .note { position:fixed; right:14px; bottom:18px; font-size:11px; color:var(--muted); background:#fff; border:1px solid var(--border); border-radius:99px; padding:4px 10px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="switcher"><button type="button" id="prev" title="上一个变体">◀</button><span class="label" id="vlabel"></span><button type="button" id="next" title="下一个变体">▶</button></div>
<div class="note">PROTOTYPE — 模拟数据</div>
<script>
// ============ 数据：weekly-report 一次运行的事件序列（CoreMindEvent 契约） ============
const EVENTS = [
  { type: "step_start", stepId: "s1", kind: "prompt" },
  { type: "agent_start", agent: "collector", stepId: "s1" },
  { type: "text_delta", agent: "collector", delta: "开始收集本周工作内容……\n", stepId: "s1" },
  { type: "tool_call", agent: "collector", tool: "read", args: { path: "notes.txt" }, stepId: "s1" },
  { type: "tool_result", agent: "collector", tool: "read", isError: false, stepId: "s1" },
  { type: "text_delta", agent: "collector", delta: "读取到本周记录：重构 coremind-config、修复 9 项缺陷、发布 6 个 npm 包。\n", stepId: "s1" },
  { type: "tool_call", agent: "collector", tool: "bash", args: { command: "git log --oneline -5" }, stepId: "s1" },
  { type: "tool_result", agent: "collector", tool: "bash", isError: true, stepId: "s1" },
  { type: "text_delta", agent: "collector", delta: "git 命令失败（目录无仓库），改用目录扫描……\n", stepId: "s1" },
  { type: "tool_call", agent: "collector", tool: "ls", args: { path: "packages" }, stepId: "s1" },
  { type: "tool_result", agent: "collector", tool: "ls", isError: false, stepId: "s1" },
  { type: "text_delta", agent: "collector", delta: "收集完成：本周 3 项主要工作。", stepId: "s1" },
  { type: "agent_end", agent: "collector", stepId: "s1" },
  { type: "step_end", stepId: "s1", ok: true },
  { type: "step_start", stepId: "p1", kind: "parallel" },
  { type: "agent_start", agent: "writer", stepId: "p1" },
  { type: "text_delta", agent: "writer", delta: "撰写周报正文：本周完成一期验收与 9 项修复，发布 6 包；二期落地断点续聊与自动压缩。", stepId: "p1" },
  { type: "agent_end", agent: "writer", stepId: "p1" },
  { type: "agent_start", agent: "summarizer", stepId: "p1" },
  { type: "text_delta", agent: "summarizer", delta: "要点总结：交付质量把关、核心功能落地、测试全绿。", stepId: "p1" },
  { type: "agent_end", agent: "summarizer", stepId: "p1" },
  { type: "step_end", stepId: "p1", ok: true },
  { type: "step_start", stepId: "s2", kind: "if" },
  { type: "step_end", stepId: "s2", ok: true },
  { type: "step_start", stepId: "s3", kind: "prompt" },
  { type: "agent_start", agent: "reporter", stepId: "s3" },
  { type: "text_delta", agent: "reporter", delta: "正在生成最终周报……", stepId: "s3" },
  { type: "text_delta", agent: "reporter", delta: "《本周周报》已生成，共 3 个章节。", stepId: "s3" },
  { type: "agent_end", agent: "reporter", stepId: "s3" },
  { type: "step_end", stepId: "s3", ok: true },
];
// 步骤结构（变体 A 步骤图 / C 步进条用；p1 的并行子代理）
const STEPS = [
  { id: "s1", kind: "prompt", label: "收集本周工作", agents: ["collector"] },
  { id: "p1", kind: "parallel", label: "并行撰写与总结", agents: ["writer", "summarizer"] },
  { id: "s2", kind: "if", label: "检查变更", agents: [] },
  { id: "s3", kind: "prompt", label: "生成周报", agents: ["reporter"] },
];
const AGENTS = ["collector", "writer", "summarizer", "reporter"];
const AVATAR = { collector:"收", writer:"写", summarizer:"总", reporter:"报" };
const COLOR  = { collector:"#2563eb", writer:"#7c3aed", summarizer:"#0891b2", reporter:"#16a34a" };
const STEP_IDX = Object.fromEntries(STEPS.map((s, i) => [s.id, i]));

// ============ 状态 ============
let played = 0, timer = null;
const playedEvents = () => EVENTS.slice(0, played);
// 步骤状态：pending / running / ok / fail
function stepStatus(id) {
  const es = playedEvents();
  const start = es.findIndex((e) => e.type === "step_start" && e.stepId === id);
  if (start < 0) return "pending";
  for (let i = start; i < es.length; i++) {
    if (es[i].type === "step_end" && es[i].stepId === id) return es[i].ok ? "ok" : "fail";
  }
  return "running";
}
// 统计（模拟：每事件 ~140 token、~380ms）
const stats = () => {
  const done = played === EVENTS.length;
  const running = played > 0 && !done;
  return {
    token: played * 140, ms: played * 380,
    badge: done ? "完成" : running ? "运行中" : "待运行",
    cls: done ? "done" : running ? "running" : "wait",
    pct: Math.round((played / EVENTS.length) * 100),
  };
};
// 按 agent 聚合文本块与工具（变体 A 输出区 / C 泳道）
function agentBlocks() {
  const blocks = {};
  for (const e of playedEvents()) {
    if (e.type === "agent_start") blocks[e.agent] = { text: "", tools: [], running: true };
    if (e.type === "text_delta") {
      blocks[e.agent] ??= { text: "", tools: [] };
      blocks[e.agent].text += e.delta;
    }
    if (e.type === "tool_call") {
      blocks[e.agent] ??= { text: "", tools: [] };
      blocks[e.agent].tools.push({ ...e, isError: undefined });
    }
    if (e.type === "tool_result") {
      blocks[e.agent] ??= { text: "", tools: [] };
      const b = blocks[e.agent];
      const t = b.tools.find((x) => x.tool === e.tool && x.isError === undefined) ?? b.tools.at(-1);
      if (t) t.isError = e.isError;
    }
    if (e.type === "agent_end" && blocks[e.agent]) blocks[e.agent].running = false;
  }
  return blocks;
}

// ============ 变体 A：流程视图（三栏） ============
function renderA() {
  const s = stats(), blocks = agentBlocks();
  const stepsHtml = STEPS.map((st) => {
    const stt = stepStatus(st.id);
    const subs = st.agents.map((a) => `<div class="sub">· ${a}</div>`).join("");
    return `<div class="step"><span class="dot ${stt}"></span><div><div class="name">${st.label} <span class="kind">${st.kind}</span></div>${subs}</div></div>`;
  }).join("");
  const outHtml = Object.entries(blocks).map(([a, b]) => `
    <div class="agent-block">
      <div class="agent-head"><span class="avatar" style="background:${COLOR[a]}">${AVATAR[a]}</span>${a} ${b.running ? "…" : "✓"}</div>
      <div class="agent-body">${escapeHtml(b.text)}</div>
      ${b.tools.map((t) => `<div class="tool-row">${t.tool} ${t.isError === undefined ? "…" : t.isError ? '<span class="t-err">✗</span>' : '<span class="t-ok">✓</span>'} ${escapeHtml(JSON.stringify(t.args ?? {}))}</div>`).join("")}
    </div>`).join("") || `<div style="font-size:13px;color:var(--muted);padding:20px;text-align:center">点击「▶ 运行」开始回放</div>`;
  const toolsHtml = playedEvents().filter((e) => e.type === "tool_call").map((e) => {
    const r = playedEvents().find((x) => x.type === "tool_result" && x.tool === e.tool && x.agent === e.agent);
    return `<div class="titem"><span class="tt">${e.tool}</span> <span class="${r ? (r.isError ? "err" : "ok") : ""}">${r ? (r.isError ? "✗" : "✓") : "…"}</span><div class="args">${escapeHtml(JSON.stringify(e.args))}</div></div>`;
  }).join("") || `<div style="font-size:12px;color:var(--muted)">暂无工具调用</div>`;
  return `
    <div class="topbar"><span class="title">CoreMind · 周报生成工作流</span><span class="badge ${s.cls}">${s.badge}</span><span class="stat">耗时 <b>${s.ms}ms</b> · token <b>${s.token}</b></span></div>
    <div class="controls">${playControls()}</div>
    <div class="va">
      <div class="panel"><h3>工作流步骤</h3><div class="steps">${stepsHtml}</div></div>
      <div class="panel"><h3>Agent 输出</h3><div class="out">${outHtml}</div></div>
      <div class="panel"><h3>工具日志</h3><div class="tools">${toolsHtml}</div></div>
    </div>`;
}

// ============ 变体 B：控制台时间线（深色单栏） ============
function renderB() {
  const s = stats();
  let t = 0;
  const lines = playedEvents().map((e) => {
    t += 380;
    const time = `${Math.floor(t / 1000)}.${String(t % 1000).padStart(3, "0")}`;
    switch (e.type) {
      case "step_start":
        return `<div class="stepbar">▸ 步骤 ${e.stepId}（${e.kind}）${e.stepId === "p1" ? " — 并行" : ""}</div>`;
      case "step_end":
        return `<div class="stepbar" style="color:${e.ok ? "#4ade80" : "#f87171"}">${e.ok ? "✓" : "✗"} 步骤 ${e.stepId} 完成</div>`;
      case "agent_start":
        return `<div class="line agent-line"><span class="t">${time}</span><span class="who">[${e.agent}]</span> 开始</div>`;
      case "text_delta":
        return `<div class="line"><span class="t">${time}</span><div class="text-block">${escapeHtml(e.delta)}</div></div>`;
      case "tool_call":
        return `<div class="line tool-line"><span class="t">${time}</span><span>⚙ ${e.tool} ${escapeHtml(JSON.stringify(e.args))}</span></div>`;
      case "tool_result":
        return `<div class="line tool-line"><span class="t">${time}</span><span class="${e.isError ? "res-err" : "res-ok"}">${e.isError ? "✗ 失败" : "✓ 成功"}</span></div>`;
      case "agent_end":
        return `<div class="line agent-line"><span class="t">${time}</span><span class="who">[${e.agent}]</span> 完成</div>`;
      default:
        return "";
    }
  }).join("");
  return `
    <div class="vb">
      <div class="topbar"><span class="title">CoreMind · 运行控制台</span><span class="badge ${s.cls}">${s.badge}</span><span class="stat">耗时 <b>${s.ms}ms</b> · token <b>${s.token}</b> · 事件 <b>${played}/${EVENTS.length}</b></span></div>
      <div class="controls">${playControls()}</div>
      ${lines}
      ${played === 0 ? `<div style="color:#475569;padding:20px;text-align:center">点击「▶ 运行」开始回放</div>` : ""}
    </div>`;
}

// ============ 变体 C：泳道视图（按 agent 分栏 + 概览卡） ============
function renderC() {
  const s = stats(), blocks = agentBlocks();
  const cards = [
    ["运行状态", s.badge, s.cls === "done" ? "#16a34a" : s.cls === "running" ? "#2563eb" : "#64748b"],
    ["耗时", `${s.ms}ms`, "#0f172a"],
    ["token", String(s.token), "#0f172a"],
    ["步骤", `${playedEvents().filter((e) => e.type === "step_end").length}/${STEPS.length}`, "#0f172a"],
  ].map(([k, v, c]) => `<div class="card"><div class="k">${k}</div><div class="v" style="color:${c}">${v}</div></div>`).join("");
  const lanes = AGENTS.map((a) => {
    const b = blocks[a];
    const body = b
      ? `<div class="msg">${escapeHtml(b.text)}${b.tools.map((t) => `<div class="toolrow">⚙ ${t.tool} <span class="${t.isError ? "err" : "ok"}">${t.isError === undefined ? "…" : t.isError ? "✗" : "✓"}</span></div>`).join("")}</div>`
      : `<div style="font-size:11px;color:var(--muted);text-align:center;padding-top:16px">待命</div>`;
    return `<div class="lane"><h3><span class="avatar" style="background:${COLOR[a]}">${AVATAR[a]}</span>${a}</h3><div class="body">${body}</div></div>`;
  }).join("");
  const steps = STEPS.map((st) => {
    const stt = stepStatus(st.id);
    const cls = stt === "ok" ? "done" : stt === "running" ? "run" : "";
    return `<span class="s ${cls}"><span class="dot"></span>${st.id}</span>`;
  }).join("");
  return `
    <div class="topbar"><span class="title">CoreMind · 周报工作流</span><span class="badge ${s.cls}">${s.badge}</span></div>
    <div class="controls">${playControls()}</div>
    <div class="vc">
      <div class="cards">${cards}</div>
      <div class="stepline">${steps}</div>
      <div class="lanes" style="margin-top:12px">${lanes}</div>
    </div>`;
}

// ============ 公共：播放控制 / 切换器 ============
function playControls() {
  const s = stats();
  const running = timer !== null;
  return `<button type="button" id="play">${running ? "⏸ 暂停" : "▶ 运行"}</button><button type="button" id="reset">↺ 重置</button><div class="progress"><div style="width:${s.pct}%"></div></div><span style="font-size:12px;color:var(--muted)">${played}/${EVENTS.length}</span>`;
}
function play() {
  if (timer) { clearInterval(timer); timer = null; render(); return; }
  timer = setInterval(() => {
    if (played >= EVENTS.length) { clearInterval(timer); timer = null; }
    else played += 1;
    render();
  }, 350);
}
function reset() { clearInterval(timer); timer = null; played = 0; render(); }

// ============ 主渲染与切换 ============
const VARIANTS = ["A", "B", "C"];
const VNAMES = { A: "流程视图", B: "控制台时间线", C: "泳道视图" };
let variant = new URLSearchParams(location.search).get("variant") || "A";
function render() {
  const app = document.getElementById("app");
  app.innerHTML = variant === "A" ? renderA() : variant === "B" ? renderB() : renderC();
  document.getElementById("vlabel").innerHTML = `${variant} — <b>${VNAMES[variant]}</b>`;
  const playBtn = document.getElementById("play");
  if (playBtn) playBtn.onclick = play;
  const resetBtn = document.getElementById("reset");
  if (resetBtn) resetBtn.onclick = reset;
}
function cycle(dir) {
  variant = VARIANTS[(VARIANTS.indexOf(variant) + dir + VARIANTS.length) % VARIANTS.length];
  history.replaceState(null, "", `?variant=${variant}`);
  render();
}
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.addEventListener("keydown", (e) => {
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
render();
</script>
</body>
