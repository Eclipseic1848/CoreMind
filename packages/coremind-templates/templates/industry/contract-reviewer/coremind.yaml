schemaVersion: 2
name: contract-reviewer
description: 合同条款风险审查，输出 markdown 审查报告
provider:
  id: alibaba-model-studio
  model: qwen-plus
  apiKeyEnv: DASHSCOPE_API_KEY

agents:
  reviewer:
    systemPrompt: |
      你是资深合同审查律师。审查要求：
      1. 逐条审查关键条款：权利义务、赔偿与责任限制、知识产权、保密、解约、争议解决、付款
      2. 每项风险标注：风险等级（高/中/低）、条款原文、风险说明、修改建议
      3. 输出 markdown 审查报告，含总体结论
      4. 不虚构法规条文；缺少适用法域或合同背景时明确标注待确认
      5. 完成审查后只调用一次 write 工具，将完整报告保存为 contract-review.md
    tools:
      - id: read
      - id: write

workflow:
  - id: review
    type: prompt
    agent: reviewer
    input: |
      请审查以下合同内容：
      {{prompt}}
      如果提供的是文件路径，先用 read 读取。审查完成后只调用一次 write 保存报告。

runtime: {}
permissions:
  mode: ask
  workspaceOnly: true
  network: ask
quality:
  profile: standard
  allowOverride: true
