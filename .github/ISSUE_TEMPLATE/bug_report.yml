name: Bug 报告
description: 提交可复现的 CoreMind 缺陷
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "感谢反馈。安全漏洞请勿在此公开，请使用仓库 Security 页面的私密报告入口。"
  - type: input
    id: version
    attributes: { label: CoreMind 版本, placeholder: "例如 0.7.1" }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: 环境, description: "操作系统、Node.js/Python 版本和使用入口" }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: 最小复现, description: "提供命令、脱敏配置和最短步骤。不要提交密钥或业务数据。" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 预期行为 }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: 实际行为与日志, description: "请删除敏感信息。" }
    validations: { required: true }
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 本报告不包含密钥、个人信息或漏洞利用细节。
          required: true
