name: Prepare Release Pull Request

on:
  workflow_dispatch:
    inputs:
      release_as:
        description: "目标版本，例如 0.3.0"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 创建或更新草稿发布 PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          release-type: node
          path: .
          release-as: ${{ inputs.release_as }}
          skip-github-release: true
      - name: 转为草稿发布 PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pr_number="$(jq -r '.number' <<< "$RELEASE_PR")"
          if [[ "$(gh pr view "$pr_number" --json isDraft --jq .isDraft)" != "true" ]]; then
            gh pr ready "$pr_number" --undo
          fi
