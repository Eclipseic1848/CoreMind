name: Engineering CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.windows_original_head_diagnostic == true && github.ref == 'refs/heads/fix/issue-354-coding-context-diagnostic' && 'Diagnostic-only #354 original-head Python reproduction' || ' ' }}

on:
  workflow_dispatch:
    inputs:
      windows_original_head_diagnostic:
        description: "仅诊断 #354 原始失败 head 的 Python 目标用例；不形成工程或候选资格"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engineering:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.windows_original_head_diagnostic == true && github.ref == 'refs/heads/fix/issue-354-coding-context-diagnostic') }}
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_original_head_diagnostic == true && github.ref == 'refs/heads/fix/issue-354-coding-context-diagnostic' && 'Diagnostic-only (regular gate omitted)' || format('Engineering ({0}, Node {1})', matrix.os, matrix.node) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x]
    steps:
      - name: 开始记录实际运行时间
        shell: bash
        run: |
          echo "COREMIND_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          echo "COREMIND_JOB_STARTED_EPOCH=$(date +%s)" >> "${GITHUB_ENV}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          npm install --global npm@11.5.1
          npm ci

      - name: 安装 Linux sandbox 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 代码风格检查
        run: npx biome check .

      - name: 生产依赖与开发工具风险门禁
        run: npm run security:audit

      - name: 构建与类型检查
        run: |
          npm run build
          npm run typecheck

      - name: 跨进程 Workspace Lease 验收
        run: npm run acceptance:workspace-lease

      - name: 核心依赖锁步与模块合同
        run: |
          npm run dependencies:check
          node scripts/phase2-baseline.mjs
          npm run check:modules

      - name: 双语文档与文档站
        run: |
          npm run check:docs
          npm run docs:audit
          npm run docs:build

      - name: 供应商矩阵一致性
        shell: bash
        run: |
          npm run providers:matrix
          git diff --exit-code -- docs/providers

      - name: 核心确定性测试
        run: npm run test:engineering -- --maxWorkers=1

      - name: 取消准入边界与固定种子回归
        env:
          RACE_SEED_START: "4"
          RACE_SEED_END: "5"
        # 工程门定向回放失败种子；候选稳定性矩阵仍执行完整 1000 种子。
        run: node node_modules/vitest/vitest.mjs run --project=coremind-runtime-race-matrix --maxWorkers=1

      - name: 构建 Python worker
        run: npm run build:python-worker

      - name: Python SDK 与跨语言合同（离线）
        run: |
          python -m pip install --disable-pip-version-check ./python
          python -W error::ResourceWarning -m unittest discover -s python/tests -p "test_*.py" -v
          python -W error::ResourceWarning -m unittest discover -s examples/golden/python-data-analysis/tests -p "test_*.py" -v

      - name: 示例配置冒烟（离线）
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; import { parseConfigText, validateConfig } from 'coremind-config'; for (const f of ['examples/hello.yaml','examples/multi-agent.yaml','examples/workflow.yaml']) { validateConfig(parseConfigText(readFileSync(f, 'utf8'), f)); console.log('ok:', f); }"

      - name: 安装 Python 3.14 认证回归环境
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Python 3.14 认证取消与真实错误传播（离线）
        run: |
          python -X utf8 -m pip install --disable-pip-version-check ./python
          python -X utf8 -W error::ResourceWarning -m unittest discover -s python/tests -p "test_mcp_auth.py" -v

      - name: Python 3.14 工具延迟注解与真实往返（离线）
        run: python -X utf8 -W error::ResourceWarning -m unittest discover -s python/tests -p "test_tool_annotations.py" -v

      - name: 记录实际运行时间
        if: always()
        shell: bash
        run: |
          finished_epoch="$(date +%s)"
          duration_seconds="$((finished_epoch - COREMIND_JOB_STARTED_EPOCH))"
          {
            echo "### Engineering CI · ${{ matrix.os }}"
            echo "- 开始：${COREMIND_JOB_STARTED_AT}"
            echo "- 耗时：${duration_seconds} 秒"
            echo "- 结果：${{ job.status }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  windows-original-head-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_original_head_diagnostic == true && github.ref == 'refs/heads/fix/issue-354-coding-context-diagnostic' }}
    name: Diagnostic-only issue-354 original-head Python reproduction
    runs-on: windows-latest
    steps:
      - name: 开始记录实际运行时间
        shell: bash
        run: |
          echo "COREMIND_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          echo "COREMIND_JOB_STARTED_EPOCH=$(date +%s)" >> "${GITHUB_ENV}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.3"
          cache: npm

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.9"

      - name: 安装依赖
        run: |
          npm install --global npm@11.5.1
          npm ci

      - name: 安装 Linux sandbox 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 代码风格检查
        run: npx biome check .

      - name: 生产依赖与开发工具风险门禁
        run: npm run security:audit

      - name: 构建与类型检查
        run: |
          npm run build
          npm run typecheck

      - name: 跨进程 Workspace Lease 验收
        run: npm run acceptance:workspace-lease

      - name: 核心依赖锁步与模块合同
        run: |
          npm run dependencies:check
          node scripts/phase2-baseline.mjs
          npm run check:modules

      - name: 双语文档与文档站
        run: |
          npm run check:docs
          npm run docs:audit
          npm run docs:build

      - name: 供应商矩阵一致性
        shell: bash
        run: |
          npm run providers:matrix
          git diff --exit-code -- docs/providers

      - name: 原始 Python 目标用例复现搜索（Diagnostic-only）
        run: python -X utf8 scripts/diagnose-original-python-command.py

      - name: 留存原始 head 诊断证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-354-original-head-diagnostic-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scratch/issue-354/evidence
          if-no-files-found: warn
