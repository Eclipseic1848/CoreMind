name: Sandbox mechanism proof 380

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 恢复原 Linux 沙箱依赖环境
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 验证原报错与后续命名空间权限
        shell: bash
        run: |
          . /etc/os-release
          printf 'OS=%s\n' "$VERSION_ID"
          test "$VERSION_ID" = 26.04
          uname -r
          bwrap --version
          dpkg-query -W bubblewrap apparmor
          test "$(git rev-parse HEAD^)" = 938429838c456bc16ea6fe714386c330e636fea9
          helper_dir=packages/coremind-tools/src/vendor/linux-sandbox
          python3 -I - "$helper_dir" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          asset = "bin/x64/apply-seccomp"
          digest = hashlib.sha256((root / asset).read_bytes()).hexdigest()
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert digest == manifest["artifacts"][asset], digest
          print("originalHelperSha256=" + digest)
          PY
          original="$RUNNER_TEMP/coremind-380-original"
          install -m 700 "$helper_dir/bin/x64/apply-seccomp" "$original"
          sandbox=(bwrap --new-session --die-with-parent --unshare-net --ro-bind / / --dev /dev --unshare-pid --unshare-user --cap-drop ALL --proc /proc)
          old_status=0
          timeout 5s "${sandbox[@]}" -- "$original" /bin/true >"$RUNNER_TEMP/coremind-380-old.log" 2>&1 || old_status=$?
          printf 'caseAExit=%s\n' "$old_status"
          cat "$RUNNER_TEMP/coremind-380-old.log"
          test "$old_status" = 1
          grep -F 'apply-seccomp: write /proc/self/setgroups' "$RUNNER_TEMP/coremind-380-old.log"
          probe="$RUNNER_TEMP/coremind-380-probe.py"
          cat >"$probe" <<'PY'
          import ctypes
          import errno
          import json
          import os
          import pathlib
          import sys

          user_namespace = 0x10000000
          pid_mount_namespaces = 0x20020000
          libc = ctypes.CDLL(None, use_errno=True)
          proc = pathlib.Path("/proc/self")

          def read(name):
              try:
                  return (proc / name).read_text(encoding="utf-8").strip()
              except OSError as error:
                  return {"errno": error.errno}

          def state():
              fields = dict(line.split(":", 1) for line in read("status").splitlines() if ":" in line)
              return {
                  "pid": os.getpid(),
                  "procSelf": os.readlink(proc),
                  "profile": read("attr/apparmor/current"),
                  "setgroups": read("setgroups"),
                  **{key: fields[key].strip() for key in ("CapEff", "CapPrm", "CapBnd", "NoNewPrivs")},
              }

          def unshare(flags):
              if libc.unshare(flags) == 0:
                  return 0
              return ctypes.get_errno()

          def write(name, value):
              try:
                  fd = os.open(proc / name, os.O_WRONLY | os.O_CLOEXEC)
              except OSError as error:
                  return {"phase": "open", "errno": error.errno}
              try:
                  payload = value.encode("ascii")
                  return {"phase": "write", "errno": 0 if os.write(fd, payload) == len(payload) else errno.EIO}
              except OSError as error:
                  return {"phase": "write", "errno": error.errno}
              finally:
                  os.close(fd)

          if sys.argv[1] == "guard":
              result = {"case": "C", **state(), "nestedUsernsErrno": unshare(user_namespace)}
              print(json.dumps(result), flush=True)
              assert result["pid"] == 1 and result["procSelf"] == "1"
              assert result["NoNewPrivs"] == "1"
              assert all(int(result[key], 16) == 0 for key in ("CapEff", "CapPrm", "CapBnd"))
              assert result["nestedUsernsErrno"] in (errno.EPERM, errno.EACCES, errno.ENOSPC)
              sys.exit(0)

          uid, gid = os.geteuid(), os.getegid()
          result = {"case": "B", "outer": state(), "directPidMountErrno": unshare(pid_mount_namespaces)}
          if result["directPidMountErrno"] != errno.EPERM:
              print(json.dumps(result), flush=True)
              sys.exit(3)
          dumpable = libc.prctl(3, 0, 0, 0, 0)
          result["setDumpableResult"] = libc.prctl(4, 1, 0, 0, 0)
          result["nestedUsernsErrno"] = unshare(user_namespace)
          if result["nestedUsernsErrno"]:
              print(json.dumps(result), flush=True)
              sys.exit(2)

          result["nested"] = state()
          result["setgroupsWrite"] = write("setgroups", "deny")
          if read("setgroups") != "deny":
              print(json.dumps(result), flush=True)
              sys.exit(2)
          result["uidMap"] = write("uid_map", f"{uid} {uid} 1\n")
          result["gidMap"] = write("gid_map", f"{gid} {gid} 1\n")
          result["restoreDumpableResult"] = libc.prctl(4, int(dumpable == 1), 0, 0, 0)
          result["nestedPidMountErrno"] = unshare(pid_mount_namespaces)
          print(json.dumps(result), flush=True)
          success = result["uidMap"]["errno"] == result["gidMap"]["errno"] == result["nestedPidMountErrno"] == 0
          sys.exit(0 if success else 2)
          PY
          if timeout 10s "${sandbox[@]}" -- "$(command -v python3)" -I "$probe" narrow; then
            echo '已记录窄补丁所需的映射和命名空间证据'
          else
            narrow_status=$?
            test "$narrow_status" = 2
            timeout 10s "${sandbox[@]}" --disable-userns --as-pid-1 -- "$(command -v python3)" -I "$probe" guard
          fi
