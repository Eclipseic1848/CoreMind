name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码风格检查
        run: npx biome check .

      - name: 构建
        run: npm run build

      - name: 测试（离线）
        run: npm test

      - name: 示例配置冒烟（离线）
        run: |
          node -e "
            const { readFileSync } = require('node:fs');
            const { parseConfigText, validateConfig } = await import('coremind-config');
            for (const f of ['examples/hello.yaml','examples/multi-agent.yaml','examples/workflow.yaml']) {
              validateConfig(parseConfigText(readFileSync(f, 'utf8'), f));
              console.log('ok:', f);
            }
          "

      - name: 发布预检
        run: npm publish --dry-run --workspace coremind --workspace coremind-cli
