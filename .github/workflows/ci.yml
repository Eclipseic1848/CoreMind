name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: npm ci

      - name: 安装 Linux sandbox 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 代码风格检查
        run: npx biome check .

      - name: 生产依赖与开发工具风险门禁
        run: npm run security:audit

      - name: 构建
        run: npm run build

      - name: 二期公开合同冻结基线
        run: npm run baseline:check

      - name: 核心依赖锁步与审计报告
        run: npm run dependencies:check

      - name: 模块交付合同
        run: npm run check:modules

      - name: 双语文档与文档站
        run: |
          npm run check:docs
          npm run docs:build

      - name: 供应商矩阵一致性
        shell: bash
        run: |
          npm run providers:matrix
          git diff --exit-code -- docs/providers

      - name: 测试三连跑（离线）
        run: npm run test:stability

      - name: 覆盖率不下降门禁
        run: npm run test:coverage

      - name: 构建 Python worker
        run: npm run build:python-worker

      - name: 安装并测试 Python SDK（离线）
        run: |
          python -m pip install --disable-pip-version-check ./python
          python -W error::ResourceWarning -m unittest discover -s python/tests -p "test_*.py" -v
          python -W error::ResourceWarning -m unittest discover -s examples/golden/python-data-analysis/tests -p "test_*.py" -v

      - name: 构建 PyPI wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.5.0 twine==7.0.0
          python -m build --wheel python
          python -m twine check python/dist/*

      - name: 检查 Python wheel 内容
        run: npm run release:check-wheel

      - name: 示例配置冒烟（离线）
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; import { parseConfigText, validateConfig } from 'coremind-config'; for (const f of ['examples/hello.yaml','examples/multi-agent.yaml','examples/workflow.yaml']) { validateConfig(parseConfigText(readFileSync(f, 'utf8'), f)); console.log('ok:', f); }"

      - name: 当前平台真实伪终端验收
        run: npm run acceptance:tty

      - name: 保存当前平台真实伪终端证据
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rc-tty-${{ runner.os }}
          path: .scratch/rc-evidence/rc-tty-*.json
          if-no-files-found: error

      - name: 发布元数据预检
        run: npm run release:preflight -- --allow-dirty --defer-provider-certification

      - name: npm 包 allowlist 与禁止文件
        run: npm run release:check-npm

      - name: npm tarball、类型与干净安装
        run: npm run release:test-npm

      - name: 源码 ZIP 干净安装与构建
        run: npm run release:test-source

      - name: Release Candidate 自动验收矩阵
        run: npm run acceptance:rc -- --defer-provider-certification
