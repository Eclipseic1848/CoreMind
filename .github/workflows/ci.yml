name: Engineering CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engineering:
    name: Engineering (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x]
    steps:
      - name: 开始记录实际运行时间
        shell: bash
        run: |
          echo "COREMIND_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          echo "COREMIND_JOB_STARTED_EPOCH=$(date +%s)" >> "${GITHUB_ENV}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: npm ci

      - name: 安装 Linux sandbox 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 代码风格检查
        run: npx biome check .

      - name: 生产依赖与开发工具风险门禁
        run: npm run security:audit

      - name: 构建与类型检查
        run: |
          npm run build
          npm run typecheck

      - name: 跨进程 Workspace Lease 验收
        run: npm run acceptance:workspace-lease

      - name: 核心依赖锁步与模块合同
        run: |
          npm run dependencies:check
          npm run check:modules

      - name: 双语文档与文档站
        run: |
          npm run check:docs
          npm run docs:audit
          npm run docs:build

      - name: 供应商矩阵一致性
        shell: bash
        run: |
          npm run providers:matrix
          git diff --exit-code -- docs/providers

      - name: 核心确定性测试
        run: npm run test:engineering -- --maxWorkers=2

      - name: 构建 Python worker
        run: npm run build:python-worker

      - name: Python SDK 与跨语言合同（离线）
        run: |
          python -m pip install --disable-pip-version-check ./python
          python -W error::ResourceWarning -m unittest discover -s python/tests -p "test_*.py" -v
          python -W error::ResourceWarning -m unittest discover -s examples/golden/python-data-analysis/tests -p "test_*.py" -v

      - name: 示例配置冒烟（离线）
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; import { parseConfigText, validateConfig } from 'coremind-config'; for (const f of ['examples/hello.yaml','examples/multi-agent.yaml','examples/workflow.yaml']) { validateConfig(parseConfigText(readFileSync(f, 'utf8'), f)); console.log('ok:', f); }"

      - name: 记录实际运行时间
        if: always()
        shell: bash
        run: |
          finished_epoch="$(date +%s)"
          duration_seconds="$((finished_epoch - COREMIND_JOB_STARTED_EPOCH))"
          {
            echo "### Engineering CI · ${{ matrix.os }}"
            echo "- 开始：${COREMIND_JOB_STARTED_AT}"
            echo "- 耗时：${duration_seconds} 秒"
            echo "- 结果：${{ job.status }}"
          } >> "${GITHUB_STEP_SUMMARY}"
