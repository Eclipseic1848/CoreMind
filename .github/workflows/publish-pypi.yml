name: Publish CoreMind Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在且指向候选提交的标签，例如 v0.2.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: 验证标签、main 与双平台 CI 属于同一提交
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha="$(git rev-parse HEAD)"
          git fetch origin main --no-tags
          main_sha="$(git rev-parse FETCH_HEAD)"
          test "${tag_sha}" = "${main_sha}"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${tag_sha}&status=completed&per_page=20" --jq '.workflow_runs | map(select(.event == "push" and .conclusion == "success")) | first | .conclusion // ""')"
          test "${conclusion}" = "success"

      - name: 下载同提交双平台真实伪终端证据
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=completed&per_page=20" --jq '.workflow_runs | map(select(.event == "push" and .conclusion == "success")) | first | .id')"
          mkdir -p .scratch/rc-evidence/downloads .scratch/rc-evidence/final
          gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --pattern 'rc-tty-*' --dir .scratch/rc-evidence/downloads
          find .scratch/rc-evidence/downloads -type f -name 'rc-tty-*.json' -exec cp {} .scratch/rc-evidence/final/ \;
          rm -rf .scratch/rc-evidence/downloads
          mv .scratch/rc-evidence/final/*.json .scratch/rc-evidence/
          rmdir .scratch/rc-evidence/final

      - name: 校验 P20 证据绑定与候选完整性
        run: node scripts/rc-acceptance.mjs --verify-manual-only

  build:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: 固定发布工具链
        run: |
          npm install --global npm@11.5.1
          python -m pip install --disable-pip-version-check build==1.5.0 twine==7.0.0

      - name: 构建并验证同提交发布物
        env:
          COREMIND_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          npm ci
          npm run build
          npm run check
          npm run security:audit
          npm run release:bundle -- --tag "${COREMIND_RELEASE_TAG}"

      - name: 保存一次构建的全部发布物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coremind-release-bundle
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: 下载已验证发布物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coremind-release-bundle
          path: release-artifacts

      - name: 校验已验证发布物哈希
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS.txt

      - name: 生成 GitHub 构建来源证明
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/**/*

  npm:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/coremind-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - name: 安装 npm 可信发布工具链
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install --global npm@11.5.1

      - name: 下载已验证发布物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coremind-release-bundle
          path: release-artifacts

      - name: 校验哈希并按依赖顺序发布八个 npm 包
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS.txt
          cd ..
          node scripts/publish-npm-artifacts.mjs --publish release-artifacts

  pypi:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/coremind-ai
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - name: 下载已验证发布物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coremind-release-bundle
          path: release-artifacts

      - name: 校验已验证发布物哈希
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS.txt

      - name: 判断 PyPI 同版本产物是否可安全续传
        id: pypi-state
        run: echo "decision=$(node scripts/verify-pypi-artifact.mjs release-artifacts)" >> "${GITHUB_OUTPUT}"

      - name: 使用可信发布上传 PyPI
        if: steps.pypi-state.outputs.decision == 'publish'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifacts/python

  release:
    needs: [npm, pypi, attest]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: 下载已验证发布物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coremind-release-bundle
          path: release-artifacts

      - name: 校验已验证发布物哈希
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS.txt

      - name: 创建仅含当前独立源码包与校验信息的 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          prerelease=""
          if [[ "${RELEASE_TAG}" == *-* ]]; then prerelease="--prerelease"; fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            mkdir -p existing-release
            gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir existing-release
            for asset in release-artifacts/source/*.zip release-artifacts/SHA256SUMS.txt release-artifacts/release-manifest.json; do
              name="$(basename "${asset}")"
              if [[ -f "existing-release/${name}" ]]; then
                cmp --silent "${asset}" "existing-release/${name}" || {
                  echo "GitHub Release 已存在冲突资产：${name}" >&2
                  exit 1
                }
              else
                gh release upload "${RELEASE_TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}"
              fi
            done
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            release-artifacts/source/*.zip \
            release-artifacts/SHA256SUMS.txt \
            release-artifacts/release-manifest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "CoreMind ${RELEASE_TAG#v}" \
            ${prerelease}

      - name: 派发双语文档部署
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main --repo "${GITHUB_REPOSITORY}"
