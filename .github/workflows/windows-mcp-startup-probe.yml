name: Windows MCP current startup diagnostics

on:
  push:
    branches: [codex/diagnose-windows-mcp-startup-current]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: [22.x]
    steps:
      - name: 开始记录实际运行时间
        shell: bash
        run: |
          echo "COREMIND_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          echo "COREMIND_JOB_STARTED_EPOCH=$(date +%s)" >> "${GITHUB_ENV}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          npm install --global npm@11.5.1
          npm ci

      - name: 安装 Linux sandbox 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 完整工程与发布前置门禁
        shell: bash
        run: |
          npx biome check .
          npm run security:audit
          npm run build
          npm run typecheck
          npm run acceptance:workspace-lease
          npm run baseline:check
          npm run dependencies:check
          npm run check:modules
          npm run check:docs
          npm run docs:audit
          npm run docs:build

      - name: 供应商矩阵一致性
        shell: bash
        run: |
          npm run providers:matrix
          git diff --exit-code -- docs/providers

      - name: 测试三连跑（离线）
        run: npm run test:stability

      - name: 保存有界启动阶段证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-mcp-full-profile-${{ github.sha }}
          path: |
            .scratch/mcp-startup/*.jsonl
            .scratch/stability-node-win32.json
          if-no-files-found: error
          retention-days: 14
