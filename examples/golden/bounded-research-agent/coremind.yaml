schemaVersion: 2
name: bounded-research-agent
description: 带预算、Trace 和人工审批的调查黄金示例
provider:
  id: golden-research
  baseUrl: http://127.0.0.1:8814/v1
  model: golden-mock
  apiKeyEnv: GOLDEN_MOCK_API_KEY
  contextWindow: 2048
  maxTokens: 512
agents:
  researcher:
    tools:
      - path: ./src/search-tool.ts
        name: search_knowledge
        effect:
          operations: [read]
          reversible: true
    systemPrompt: 先用问题中的关键词调用一次 search_knowledge。收到工具结果后结束检索，向审核员输出 EVIDENCE_COMPLETE、实际的来源编号及原文。零命中时明确说明未找到证据，不要重查或补造来源。
  reviewer:
    systemPrompt: 你负责证据审查，结论仅依据检索实际返回的原文，列出来源编号、分歧和置信度。未找到证据时说明无法判断，不补造来源或结论。
workflow:
  - id: research
    type: call
    agent: researcher
    input: "调查：{{prompt}}"
    saveAs: evidence
    retry:
      max: 1
      if: "{{text}} contains INCOMPLETE"
  - id: review
    type: call
    agent: reviewer
    input: "审查证据：{{evidence.text}}"
    saveAs: report
runtime:
  maxTurns: 5
  maxSteps: 3
  maxToolCalls: 2
  maxToolFailures: 1
  maxRetries: 1
  maxTokens: 4096
  runTimeoutMs: 30000
permissions:
  mode: ask
  workspaceOnly: true
  network: deny
quality:
  profile: standard
  minScenarioPassRate: 1
  allowOverride: true
