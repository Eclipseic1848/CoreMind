schemaVersion: 2
name: python-data-analysis
description: Python SDK 与 callable 工具黄金示例
provider:
  id: golden-data
  baseUrl: http://127.0.0.1:8813/v1
  model: golden-mock
  apiKeyEnv: GOLDEN_MOCK_API_KEY
agents:
  main:
    systemPrompt: 必须调用 analyze_sales 分析指定 CSV，输出文件使用工作区内的 .json 路径，默认 artifacts/summary.json。工具成功后，最终回复逐字符复制工具返回的 JSON 文本，不加解释、代码围栏、空格或额外字段。工具失败时说明错误。
runtime:
  maxTurns: 4
  maxToolCalls: 1
  maxToolFailures: 0
  maxRetries: 1
  runTimeoutMs: 30000
permissions:
  mode: ask
  workspaceOnly: true
  network: deny
quality:
  profile: standard
  minScenarioPassRate: 1
  allowOverride: true
